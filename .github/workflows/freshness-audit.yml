name: Weekly knowledge freshness audit

on:
  schedule:
    - cron: "17 17 * * 5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run knowledge:audit
      - name: Propose freshness changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then exit 0; fi
          branch="automation/freshness-audit-$(date -u +%Y%m%d)"
          git config user.name "agent-workbench[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add knowledge/
          git commit -m "audit knowledge freshness"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Knowledge freshness audit $(date -u +%F)" --body "Automated status transitions based on each knowledge item's validity window." || true
