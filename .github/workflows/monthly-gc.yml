name: Monthly knowledge GC

on:
  schedule:
    - cron: "23 9 1 * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gc:
    if: github.repository != 'Alex-2000-m/agent-engineer-workbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run knowledge:gc
      - name: Propose deep cleanup changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then exit 0; fi
          branch="automation/knowledge-gc-$(date -u +%Y%m%d)"
          git config user.name "agent-workbench[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add knowledge/
          git commit -m "run deep knowledge gc"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Monthly knowledge GC $(date -u +%F)" --body "Proposes duplicate or expired items for cleanup review. The user decides whether to keep or archive each item." || true
