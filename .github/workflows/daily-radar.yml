name: Daily agent radar

on:
  schedule:
    - cron: "37 8 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  radar:
    if: github.repository != 'Alex-2000-m/agent-engineer-workbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Queue source changes for the user's local AI pipeline
        run: node scripts/sync-radar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_ONLY: "1"
      - name: Propose knowledge changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then exit 0; fi
          branch="automation/daily-radar-$(date -u +%Y%m%d)"
          git config user.name "agent-workbench[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add knowledge/reports/
          git commit -m "queue daily agent radar"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Daily agent radar $(date -u +%F)" --body "Queues source changes only. The local Codex pipeline creates Chinese summaries and the RAG index before items enter the active library." || true
